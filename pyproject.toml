[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dynphony-c"
version = "0.13.1"
description = "A small typed C compiler targeting the Dynphony ISA"
requires-python = ">=3.10"
dependencies = ["pycparser>=2.21,<3"]

[project.scripts]
dyncc = "dynphony.cli:main"

[tool.setuptools.packages.find]
include = ["dynphony*"]

[tool.cibuildwheel]
build = "cp3{10,11,12,13,14,15}-*"
test-command = "python -c \"from dynphony import compile_source; from dynphony.emulator import Machine, native_available, native_run; assert native_available(); r=compile_source('int main(void){return 6*7;}'); m=Machine(r.image.binary); assert native_run(m, r.image.symbols['_halt']) == 42\""

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64", "universal2"]

[tool.cibuildwheel.windows]
archs = ["AMD64", "x86", "ARM64"]
