name: GCC Dynphony smoke build

on:
  push:
    branches: [gcc-backend-bootstrap]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential flex bison libgmp-dev libmpfr-dev libmpc-dev texinfo

      - name: Download GCC 16.2
        run: |
          curl -L --retry 3 -o /tmp/gcc.tar.xz https://gcc.gnu.org/pub/gcc/releases/gcc-16.2.0/gcc-16.2.0.tar.xz
          tar -C /tmp -xf /tmp/gcc.tar.xz

      - name: Inject Dynphony target over bootstrap tuple
        run: |
          # GCC's top-level config.sub does not know the new CPU name yet. For this
          # bring-up only, keep the accepted moxie tuple but replace the backend
          # files that config.gcc selects with the Dynphony implementation.
          cp experimental/gcc-16-dynphony/gcc/config/dynphony/dynphony.md /tmp/gcc-16.2.0/gcc/config/moxie/moxie.md
          cp experimental/gcc-16-dynphony/gcc/config/dynphony/dynphony.cc /tmp/gcc-16.2.0/gcc/config/moxie/moxie.cc
          cp experimental/gcc-16-dynphony/gcc/config/dynphony/dynphony.h /tmp/gcc-16.2.0/gcc/config/moxie/moxie.h
          cp experimental/gcc-16-dynphony/gcc/config/dynphony/dynphony-protos.h /tmp/gcc-16.2.0/gcc/config/moxie/moxie-protos.h
          cp experimental/gcc-16-dynphony/gcc/config/dynphony/dynphony-protos.h /tmp/gcc-16.2.0/gcc/config/moxie/dynphony-protos.h
          cp experimental/gcc-16-dynphony/gcc/config/dynphony/dynphony.opt /tmp/gcc-16.2.0/gcc/config/moxie/moxie.opt

      - name: Verify injected backend sources
        run: |
          grep -q 'Dynphony GCC machine description' /tmp/gcc-16.2.0/gcc/config/moxie/moxie.md
          grep -q 'GCC Dynphony target' /tmp/gcc-16.2.0/gcc/config/moxie/moxie.h
          grep -q 'dynphony_expand_prologue' /tmp/gcc-16.2.0/gcc/config/moxie/moxie.cc
          echo 'Dynphony backend sources are installed over the bootstrap tuple.'

      - name: Configure C-only cross compiler
        run: |
          mkdir /tmp/gcc-build
          cd /tmp/gcc-build
          /tmp/gcc-16.2.0/configure --target=moxie-unknown-elf --enable-languages=c --without-headers --disable-shared --disable-threads --disable-libssp --disable-libquadmath --disable-libatomic --disable-libstdcxx

      - name: Build GCC
        run: |
          set -o pipefail
          make -C /tmp/gcc-build -j2 all-gcc 2>&1 | tee /tmp/gcc-build.log

      - name: Compile Towers of Hanoi
        run: |
          cat > /tmp/towers.c <<'EOF'
          extern unsigned input(void);
          extern void output(unsigned);

          void move_one(unsigned source, unsigned destination) {
              output(source);
              output(5);
              output(destination);
              output(5);
          }
          void move_pile(unsigned highest_disk, unsigned source, unsigned destination, unsigned spare) {
              if (highest_disk != 0)
                  move_pile(highest_disk - 1, source, spare, destination);
              move_one(source, destination);
              if (highest_disk != 0)
                  move_pile(highest_disk - 1, spare, destination, source);
          }
          int main(void) {
              unsigned highest_disk = input();
              unsigned source = input();
              unsigned destination = input();
              unsigned spare = input();
              move_pile(highest_disk, source, destination, spare);
              return 0;
          }
          EOF
          /tmp/gcc-build/gcc/xgcc -B/tmp/gcc-build/gcc/ -S -O2 -ffreestanding -fno-builtin /tmp/towers.c -o /tmp/towers.s
          cat /tmp/towers.s
          if grep -Eq '\b(ldi\.l|jsr|sto\.l|push[[:space:]]+\$)' /tmp/towers.s; then
            echo 'ERROR: output still contains Moxie mnemonics' >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gcc-dynphony-smoke
          path: |
            /tmp/towers.s
            /tmp/gcc-build.log
            /tmp/gcc-build/config.log
